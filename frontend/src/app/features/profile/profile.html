<div class="min-h-screen bg-gray-50 dark:bg-gray-900 pb-24 transition-colors duration-300">
  
  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-4 sticky top-0 z-40 transition-colors duration-300">
    <h1 class="text-xl font-bold text-gray-900 dark:text-white">Profile</h1>
  </header>

  <!-- Main Content -->
  <main class="px-4 py-6 max-w-2xl mx-auto space-y-6">
    
    <!-- 1. Account Section -->
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 border border-gray-200 dark:border-gray-700 shadow-sm transition-colors duration-300">
      <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4">Account</h2>
      
      <div class="flex items-center space-x-4">
        <!-- Avatar -->
        <div class="w-16 h-16 bg-gray-900 dark:bg-gray-700 rounded-full flex items-center justify-center text-white text-xl font-bold shrink-0">
          {{ user()?.name?.charAt(0) || 'A' }}
        </div>
        
        <!-- Info -->
        <div class="flex-1 min-w-0">
          <h3 class="text-lg font-bold text-gray-900 dark:text-white truncate">{{ user()?.name }}</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400 truncate">{{ user()?.email }}</p>
        </div>
      </div>
    </div>

        <!-- Preferences Section (Includes Dark Mode Toggle) -->
    <div class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden transition-colors duration-300">
      <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider px-6 pt-6 pb-2">Preferences</h2>
      
      <!-- Dark Mode Toggle -->
      <div class="px-6 py-4 flex items-center justify-between border-b border-gray-100 dark:border-gray-700">
        <div>
          <p class="font-medium text-gray-900 dark:text-white">Dark Mode</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Switch app to dark theme</p>
        </div>
        
        <!-- The Actual Toggle Switch -->
        <button 
          (click)="toggleDarkMode()"
          [class.bg-gray-900]="isDarkMode()"
          [class.bg-gray-200]="!isDarkMode()"
          class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none"
        >
          <span 
            [class.translate-x-6]="isDarkMode()"
            [class.translate-x-1]="!isDarkMode()"
            class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform shadow-sm"
          ></span>
        </button>
      </div>
    </div>

    <!-- 2. Documents Section -->
    <div class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden transition-colors duration-300">
      <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider px-6 pt-6 pb-2">Documents</h2>
      
      <button (click)="viewAllDocuments()" class="w-full flex items-center justify-between px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-purple-50 dark:bg-purple-900/30 rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <div class="text-left">
            <span class="block font-medium text-gray-900 dark:text-white">My Documents</span>
            <span class="text-xs text-gray-500 dark:text-gray-400">{{ documentCount() }} files uploaded</span>
          </div>
        </div>
        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- 3. Support Section -->
    <div class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden transition-colors duration-300">
      <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider px-6 pt-6 pb-2">Support</h2>
      
      <!-- Open a Ticket -->
      <button (click)="openTicket()" class="w-full flex items-center justify-between px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-700">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 bg-blue-50 dark:bg-blue-900/30 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </div>
          <span class="font-medium text-gray-900 dark:text-white">Open a ticket</span>
        </div>
        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <!-- Suggest a Feature -->
      <button (click)="suggestFeature()" class="w-full flex items-center justify-between px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 bg-green-50 dark:bg-green-900/30 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
          </div>
          <span class="font-medium text-gray-900 dark:text-white">Suggest a feature</span>
        </div>
        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- 4. App Info Section -->
    <div class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden transition-colors duration-300">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-700">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">App Version</span>
        <span class="text-sm text-gray-500 dark:text-gray-400">{{ appVersion }}</span>
      </div>
      <button class="w-full flex items-center justify-between px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition border-b border-gray-100 dark:border-gray-700">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Terms of Service</span>
        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
      <button class="w-full flex items-center justify-between px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Privacy Policy</span>
        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
          <button routerLink="/profile/change-password" class="w-full px-6 py-4 flex items-center justify-between border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition text-left">
        <span class="font-medium text-gray-900 dark:text-white">Change Password</span>
        <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>

    <!-- Sign Out Button -->
    <button 
      (click)="logout()"
      class="w-full bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 font-semibold py-4 rounded-2xl transition duration-200 border border-red-200 dark:border-red-800 flex items-center justify-center space-x-2"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span>Log out</span>
    </button>

  </main>

  <!-- Custom Confirmation Modal -->
  <app-confirm-modal
    [isOpen]="modalState().isOpen"
    [title]="modalState().title"
    [message]="modalState().message"
    [isDestructive]="modalState().isDestructive"
    (confirmed)="handleModalConfirm()"
    (cancelled)="closeModal()"
  ></app-confirm-modal>

  <!-- Bottom Navigation -->
  <app-bottom-nav></app-bottom-nav>
</div>
