<div class="min-h-screen bg-gray-50 text-gray-900 pb-24 relative">
  
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-4 py-4 flex items-center justify-between sticky top-0 z-40">
    <button (click)="goBack()" class="text-gray-600 hover:text-gray-900 transition flex items-center space-x-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      <span class="font-medium text-sm">Cancel</span>
    </button>
    <h1 class="text-lg font-bold text-gray-900">Add Vehicle</h1>
    <div class="w-16"></div> <!-- Spacer for centering -->
  </header>

  <!-- Main Content -->
  <main class="px-4 py-6 max-w-2xl mx-auto">
    
    <!-- Error Message -->
    @if (errorMessage()) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm mb-6 flex items-start">
        <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- 1. Photo Upload (Top Center) -->
      <div class="flex justify-center mb-2">
        <label class="flex flex-col items-center justify-center w-32 h-32 border-2 border-dashed border-gray-300 rounded-3xl cursor-pointer bg-white hover:bg-gray-50 transition overflow-hidden relative group shadow-sm">
          @if (imagePreview) {
            <img [src]="imagePreview" class="absolute inset-0 w-full h-full object-cover" alt="Preview">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <span class="text-xs text-white font-medium">Change</span>
            </div>
          } @else {
            <svg class="w-8 h-8 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="text-xs text-gray-500 font-medium">Add photo</span>
          }
          <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)">
        </label>
      </div>

      <!-- 2. Vehicle Name (Full Width) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Vehicle name *</label>
        <input 
          type="text" 
          [(ngModel)]="name" 
          name="name" 
          required
          placeholder="e.g. Renault Sandero Stepway"
          class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition"
        >
      </div>

      <!-- 3. Make & Model (2 Cols) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Make *</label>
          <input 
            type="text" 
            [(ngModel)]="manufacturer" 
            name="manufacturer" 
            required
            placeholder="Renault"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Model *</label>
          <input 
            type="text" 
            [(ngModel)]="model" 
            name="model" 
            required
            placeholder="Sandero"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition"
          >
        </div>
      </div>

      <!-- 4. Year & Color (2 Cols) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Year *</label>
          <input 
            type="number" 
            [(ngModel)]="year" 
            name="year" 
            required
            placeholder="2017"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Color</label>
          <input 
            type="text" 
            [(ngModel)]="color" 
            name="color" 
            placeholder="Silver"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition"
          >
        </div>
      </div>

      <!-- 5. Registration & VIN (2 Cols) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Registration *</label>
          <input 
            type="text" 
            [(ngModel)]="registration_number" 
            name="registration_number" 
            required
            placeholder="AB12CDGP"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition uppercase"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">VIN</label>
          <input 
            type="text" 
            [(ngModel)]="vin" 
            name="vin" 
            placeholder="VIN number"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition uppercase"
          >
        </div>
      </div>

      <!-- 6. Mileage & Fuel Type (2 Cols) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mileage (km) *</label>
          <input 
            type="number" 
            [(ngModel)]="mileage" 
            name="mileage" 
            required
            placeholder="0"
            class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Fuel type *</label>
          <select 
            [(ngModel)]="fuel_type" 
            name="fuel_type" 
            required
            class="w-full bg-white border border-gray-300 text-gray-900 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition appearance-none"
          >
            <option value="petrol">Petrol</option>
            <option value="diesel">Diesel</option>
            <option value="hybrid">Hybrid</option>
            <option value="electric">Electric</option>
          </select>
        </div>
      </div>

      <!-- 7. Notes (Full Width) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Notes</label>
        <textarea 
          [(ngModel)]="notes" 
          name="notes" 
          rows="3"
          placeholder="Any notes about this vehicle..."
          class="w-full bg-white border border-gray-300 text-gray-900 placeholder-gray-400 rounded-xl px-4 py-3.5 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 focus:outline-none transition resize-none"
        ></textarea>
      </div>

      <!-- Bottom Spacer for FAB -->
      <div class="h-16"></div>
    </form>
  </main>

  <!-- Floating Action Button (FAB) -->
  <button 
    type="button"
    (click)="onSubmit()"
    [disabled]="isLoading()"
    class="fixed bottom-24 right-6 w-14 h-14 bg-gray-900 text-white rounded-full shadow-xl flex items-center justify-center hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed z-50"
  >
    @if (isLoading()) {
      <app-ripple-loader size="sm" class="text-white"></app-ripple-loader>
    } @else {
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
    }
  </button>

  <!-- Bottom Navigation -->
  <app-bottom-nav></app-bottom-nav>
</div>
