<div class="min-h-screen bg-gray-900 flex flex-col">
  <div class="max-w-md w-full mx-auto flex flex-col flex-1">

    <!-- Hero Image Section -->
    <div
      class="relative overflow-hidden"
      style="height: 55vh; min-height: 380px;"
    >
      <img
        src="/car1.jpg"
        alt="hello"
        class="absolute inset-0 w-full h-full object-cover"
      >
      <div class="absolute inset-0 bg-linear-to-b from-black/40 via-black/50 to-black/80"></div>

      <div class="relative z-10 h-full flex flex-col p-6">
        <img
          src="/autocare-logo.png"
          alt="AutoCare"
          class="h-20 w-auto self-start object-contain"
        >

        <div class="mt-auto">
          <h1 class="text-white text-4xl font-bold leading-tight mb-2">
            {{ slides[currentSlide].title }}
          </h1>
          <p class="text-gray-300 text-base mb-6">
            {{ slides[currentSlide].subtitle }}
          </p>

          <!-- Carousel dots -->
    <div class="flex items-center space-x-2 mb-6">
  @for (slide of slides; track $index) {
    <button
      type="button"
      (click)="goToSlide($index)"
      [class]="$index === currentSlide
        ? 'w-8 h-2 rounded-full bg-white transition-all duration-300'
        : 'w-2 h-2 rounded-full bg-white/60 hover:bg-white/80 transition-all duration-300'"
      [attr.aria-label]="'Go to slide ' + ($index + 1)"
    ></button>
  }
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom White Card -->
    <div class="bg-white rounded-t-[2.5rem] -mt-8 relative z-10 flex-1 px-8 pt-8 pb-10 flex flex-col">
      <p class="text-gray-600 text-center mb-6">
        Get involved with your vehicles and maintenance around you — all in one simple dashboard.
      </p>

      <button
        (click)="goToLogin()"
        class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-4 rounded-full transition duration-200 mb-4"
      >
        Sign in
      </button>

      <button
        (click)="goToRegister()"
        class="w-full text-gray-500 hover:text-gray-700 font-medium py-2 transition flex items-center justify-center space-x-1"
      >
        <span>Or Create Account</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
        </svg>
      </button>
    </div>

  </div>
</div>
