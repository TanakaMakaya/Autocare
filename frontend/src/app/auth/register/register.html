<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Back Button -->
    <button 
      routerLink="/auth/login"
      class="mb-6 text-white hover:text-secondary-100 transition flex items-center space-x-2"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
      <span>Back</span>
    </button>

    <!-- Register Card -->
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="bg-gradient-to-br from-primary-500 to-primary-600 p-8 text-center">
        <h2 class="text-3xl font-bold text-white mb-2">Create Account</h2>
        <p class="text-secondary-100">Start a new adventure</p>
      </div>

      <!-- Form -->
      <div class="p-8">
        <form (ngSubmit)="onSubmit()" class="space-y-5">
          <!-- Name Fields -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
              <input 
                type="text" 
                [(ngModel)]="firstName" 
                name="firstName" 
                required
                class="w-full px-4 py-3 border-b-2 border-gray-300 focus:border-primary-500 focus:outline-none bg-transparent transition"
                placeholder="John"
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
              <input 
                type="text" 
                [(ngModel)]="lastName" 
                name="lastName" 
                required
                class="w-full px-4 py-3 border-b-2 border-gray-300 focus:border-primary-500 focus:outline-none bg-transparent transition"
                placeholder="Doe"
              >
            </div>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input 
              type="email" 
              [(ngModel)]="email" 
              name="email" 
              required
              class="w-full px-4 py-3 border-b-2 border-gray-300 focus:border-primary-500 focus:outline-none bg-transparent transition"
              placeholder="you@example.com"
            >
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input 
              type="password" 
              [(ngModel)]="password" 
              name="password" 
              required
              class="w-full px-4 py-3 border-b-2 border-gray-300 focus:border-primary-500 focus:outline-none bg-transparent transition"
              placeholder="••••••••"
            >
          </div>

          <!-- Confirm Password -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
            <input 
              type="password" 
              [(ngModel)]="confirmPassword" 
              name="confirmPassword" 
              required
              class="w-full px-4 py-3 border-b-2 border-gray-300 focus:border-primary-500 focus:outline-none bg-transparent transition"
              placeholder="••••••••"
            >
          </div>

          <!-- Terms -->
          <div class="flex items-start">
            <input type="checkbox" id="terms" class="w-4 h-4 mt-1 text-primary-500 border-gray-300 rounded focus:ring-primary-500">
            <label for="terms" class="ml-2 text-sm text-gray-600">
              I agree to the <a href="#" class="text-primary-500 hover:text-primary-600">Terms and Conditions</a>
            </label>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
            {{ errorMessage }}
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            [disabled]="isLoading"
            class="w-full bg-primary-500 hover:bg-primary-600 text-white font-semibold py-4 rounded-xl transition duration-200 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
          </button>
        </form>

        <!-- Login Link -->
        <p class="mt-6 text-center text-gray-600">
          Already have an account? 
          <a routerLink="/auth/login" class="text-primary-500 hover:text-primary-600 font-semibold">Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
